name: Release MCP

on:
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json

      - name: Install MCP dependencies
        working-directory: packages/mcp
        run: npm ci

      - name: Verify tag matches package version
        working-directory: packages/mcp
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mcp-v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Typecheck
        working-directory: packages/mcp
        run: npm run typecheck

      - name: Test
        working-directory: packages/mcp
        run: npm test

      - name: Build release tarball
        working-directory: packages/mcp
        run: |
          npm pack
          TARBALL="$(ls juanloaiza-blob-spawn-mcp-*.tgz | head -n 1)"
          ASSET="blob-spawn-mcp-${GITHUB_REF_NAME#mcp-v}.tgz"
          mv "$TARBALL" "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Create GitHub release
        working-directory: packages/mcp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="blob-spawn-mcp-${GITHUB_REF_NAME#mcp-v}.tgz"
          gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" \
            --title "BlobSpawn MCP ${GITHUB_REF_NAME#mcp-v}" \
            --generate-notes
